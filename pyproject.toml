[project]
name = "mep-sft"
version = "0.1.0"
description = "MEP clash-fix SFT data generator"
requires-python = ">=3.11"
dependencies = ["plotly>=5.20", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
ifc = [
    "ifcopenshell>=0.9.0.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mep_sft"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
